apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-learning
---
# Argo CD supplies the destination namespace to all resources that omit
# metadata.namespace. Keep this role namespace-scoped so the Application can
# be deployed into any permitted destination namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-learning-read
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-learning-read
subjects:
  - kind: ServiceAccount
    name: kube-learning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-learning-read
