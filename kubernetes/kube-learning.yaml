---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-learning
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-learning
  namespace: kube-learning
---
# This is intentionally read-only and excludes Secrets, ConfigMaps, exec, and writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-learning-read-cluster
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-learning-read-cluster
subjects:
  - kind: ServiceAccount
    name: kube-learning
    namespace: kube-learning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-learning-read-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-learning
  namespace: kube-learning
  labels:
    app.kubernetes.io/name: kube-learning
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-learning
    spec:
      serviceAccountName: kube-learning
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kube-learning
      containers:
        - name: kube_learning
          # Replace with your pushed image before applying this manifest.
          image: consultomer/kube-learning:1.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: maloomatech.local
            - name: SELF_SERVICE_URL
              value: http://kube-learning
            - name: RATE_LIMIT_REQUESTS
              value: "8"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "30"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: kube-learning
  namespace: kube-learning
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-learning
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
