{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-learning.serviceAccountName" . }}
  labels:
    {{- include "kube-learning.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.rbac.create }}
---
# This namespace-scoped Role allows the application to inspect Pods and
# Services in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-learning.fullname" . }}-read
  labels:
    {{- include "kube-learning.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-learning.fullname" . }}-read
  labels:
    {{- include "kube-learning.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-learning.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-learning.fullname" . }}-read
{{- end }}
